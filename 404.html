<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="32x32" type="image/x-icon">
  <title>404</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

      background: #0b0b0f;
      color: #f5f5f5;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .code {
      margin-bottom: 12px;

      color: #777;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;

      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto;
      max-width: 420px;

      color: #999;
      font-size: 1rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 16px;

      border: 1px solid #333;
      border-radius: 8px;

      color: #fff;
      text-decoration: none;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    a:hover {
      background: #17171d;
      border-color: #555;
    }

    @media (prefers-reduced-motion: reduce) {
      a {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="code">404</div>

    <h1>Nothing here.</h1>

    <p>
      Whatever you were looking for doesn't exist here.
    </p>
    <p>Maybe this is a bug?</p>

    <a href="/">Go home</a>
  </main>
</body>
</html>
